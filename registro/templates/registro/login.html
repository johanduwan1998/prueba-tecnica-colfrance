<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Colfrance - Iniciar sesión</title>
</head>
<body>

    <h1>Alimentos Colfrance</h1>
    <h2>Iniciar sesión</h2>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label>Usuario:</label>
        <input
            type="text"
            name="username"
            required
        >

        <br><br>

        <label>Contraseña:</label>
        <input
            type="password"
            name="password"
            required
        >

        <br><br>

        <button type="submit">
            Iniciar sesión
        </button>
    </form>

</body>
</html>
